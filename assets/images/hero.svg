<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a121d" />
      <stop offset="50%" stop-color="#0e1b2b" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <radialGradient id="turfGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#00e676" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="stadiumLight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#bgGrad)" />
  <rect width="1200" height="600" fill="url(#turfGlow)" />

  <!-- Stadium Lights Rays -->
  <polygon points="150,0 0,600 350,600" fill="url(#stadiumLight)" opacity="0.4" />
  <polygon points="1050,0 850,600 1200,600" fill="url(#stadiumLight)" opacity="0.4" />

  <!-- Field Lines Perspective -->
  <path d="M -100 600 L 450 380 L 750 380 L 1300 600 Z" fill="#092015" opacity="0.8" stroke="#00ff87" stroke-width="2" />
  <ellipse cx="600" cy="450" rx="200" ry="60" fill="none" stroke="#00ff87" stroke-width="3" opacity="0.6" />
  <line x1="600" y1="380" x2="600" y2="600" stroke="#00ff87" stroke-width="3" opacity="0.6" />

  <!-- Overlay Particles -->
  <circle cx="300" cy="200" r="3" fill="#00ff87" opacity="0.8" />
  <circle cx="850" cy="180" r="4" fill="#00ff87" opacity="0.6" />
  <circle cx="600" cy="250" r="2" fill="#ffffff" opacity="0.9" />
</svg>
